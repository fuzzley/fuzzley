name: Build and Sync to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Force deployment even if there are no changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Build production assets
        working-directory: frontend
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: yarn build

      - name: Configure git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync built assets to fuzzley.github.io
        env:
          PAT_TOKEN: ${{ secrets.MAIN_GITHUB_IO_REPO_DEPLOY_PAT }}
          FORCE_DEPLOY: ${{ github.event.inputs.force }}
        run: |
          # 1. Clone the GitHub Pages repository (fuzzley/fuzzley.github.io)
          git clone --depth 1 https://x-access-token:${{ env.PAT_TOKEN }}@github.com/fuzzley/fuzzley.github.io.git main-website

          # 2. Clean out old files in the main-website directory (except .git)
          find main-website -maxdepth 1 -mindepth 1 -not -name ".git" -exec rm -rf {} +

          # 3. Copy new build files from frontend/dist
          cp -r frontend/dist/. main-website/

          # 4. Remove project folder from GitHub Pages deployment
          rm -rf main-website/project

          # 5. Rewrite project links to point to https://fuzzley.info
          node -e '
            const fs = require("fs");
            const file = "main-website/index.html";
            let html = fs.readFileSync(file, "utf8");
            const count = (html.match(/href="(?:\.\/)?project\//g) || []).length;
            html = html.replaceAll("href=\"./project/", "href=\"https://fuzzley.info/project/");
            html = html.replaceAll("href=\"project/", "href=\"https://fuzzley.info/project/");
            fs.writeFileSync(file, html);
            console.log("Rewrote " + count + " project links to https://fuzzley.info/project/");
          '

          # 6. Commit and push the updates if there are changes
          cd main-website
          git add -A

          if git diff-index --quiet HEAD && [ "$FORCE_DEPLOY" != "true" ]; then
            echo "No changes in fuzzley production build. Skipping commit."
          else
            git commit --allow-empty -m "chore(deploy): sync fuzzley production build from fuzzley/fuzzley@${{ github.sha }}"
            git push origin HEAD
          fi
