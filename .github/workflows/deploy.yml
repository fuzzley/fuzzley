name: Verify and deploy

# Every push and pull request is type-checked, linted and built. Pushes to
# main then ask fuzzley/fuzzley.github.io to build and publish the site:
# GitHub Pages deploys from the repository its workflow runs in, so the
# publishing job lives there (.github/workflows/pages.yml in that repo).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Type-check, lint, check formatting and build
        working-directory: frontend
        run: yarn verify

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger the GitHub Pages deploy
        env:
          GH_TOKEN: ${{ secrets.MAIN_GITHUB_IO_REPO_DEPLOY_PAT }}
        run: |
          gh api repos/fuzzley/fuzzley.github.io/dispatches \
            -f event_type=fuzzley-updated \
            -f "client_payload[sha]=${{ github.sha }}"
