name: Verify and deploy

# Every push and pull request is type-checked, linted and built, and its
# Docker image is built and served. Pushes to main then ask
# fuzzley/fuzzley.github.io to build and publish its copy of the site: GitHub
# Pages deploys from the repository its workflow runs in, so the publishing
# job lives there (.github/workflows/pages.yml in that repo). This run waits
# for that one, so a failed deploy shows here too.
#
# fuzzley.info itself is served by Cloud Run, which builds the Dockerfile from
# main on its own and doesn't depend on this workflow.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Type-check, lint, check formatting and build
        working-directory: frontend
        run: yarn verify

  # Cloud Run builds the same Dockerfile from main without waiting for these
  # checks, so build the image here too, serve it, and request a few pages.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg COMMIT_SHA=${{ github.sha }} -t fuzzley-site .

      - name: Serve the image and check its pages
        run: |
          docker run -d --name site -p 8080:8080 -e PORT=8080 fuzzley-site
          for attempt in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

          failed=0
          expect() {
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$2")
            echo "$status $2"
            if [ "$status" != "$1" ]; then
              echo "::error::Expected $1 for $2, got $status."
              failed=1
            fi
          }
          expect_cache() {
            value=$(curl -s -o /dev/null -D - "http://localhost:8080$1" |
              tr -d '\r' | sed -n 's/^cache-control: //Ip')
            echo "Cache-Control: $value  $1"
            if [ "$value" != "$2" ]; then
              echo "::error::Expected Cache-Control: $2 for $1, got '$value'."
              failed=1
            fi
          }
          expect_moved() {
            location=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:8080$1")
            echo "$location  $1"
            if [ "$location" != "301 $2" ]; then
              echo "::error::Expected a 301 to $2 for $1, got '$location'."
              failed=1
            fi
          }
          expect 200 /
          expect_cache / "no-cache"
          expect 200 /projects/
          expect 200 /cv/
          expect 404 /no-such-page/
          # Every project has its page here.
          for file in frontend/src/content/projects/*.md; do
            expect 200 "/projects/$(basename "$file" .md)/"
          done
          # Every game fetched from its release is served here.
          for slug in $(jq -r 'keys[]' frontend/games.json); do
            expect 200 "/projects/$slug/play/"
            expect_cache "/projects/$slug/play/" "no-cache"
            expect 301 "/project/$slug/"
          done
          # The Solitaire Collection and Minesweeper moved to fuzzley.games, files and all.
          expect_moved /projects/solitaire/play/ https://fuzzley.games/play/solitaire/
          expect_moved /projects/solitaire/play https://fuzzley.games/play/solitaire/
          expect_moved /projects/solitaire/play/docs/screenshots/klondike/preview.webp \
            https://fuzzley.games/play/solitaire/docs/screenshots/klondike/preview.webp
          expect_moved /project/solitaire/ https://fuzzley.games/play/solitaire/
          expect_moved /projects/minesweeper/play/ https://fuzzley.games/play/minesweeper/
          expect_moved /projects/minesweeper/play https://fuzzley.games/play/minesweeper/
          expect_moved /project/minesweeper/ https://fuzzley.games/play/minesweeper/
          exit $failed

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ secrets.MAIN_GITHUB_IO_REPO_DEPLOY_PAT }}
      # Names this attempt of this run, so a re-run never mistakes an earlier
      # deploy of the same commit for its own.
      RUN_TAG: ${{ github.run_id }}.${{ github.run_attempt }}

    steps:
      - name: Trigger the GitHub Pages deploy
        run: |
          gh api repos/fuzzley/fuzzley.github.io/dispatches \
            -f event_type=fuzzley-updated \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[run]=$RUN_TAG"

      # The dispatch API doesn't say which run it started. pages.yml puts
      # "(fuzzley run <RUN_TAG>)" in each run's name, so look for that.
      - name: Wait for the GitHub Pages deploy
        run: |
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --repo fuzzley/fuzzley.github.io \
              --workflow pages.yml --event repository_dispatch --limit 20 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle | contains(\"(fuzzley run $RUN_TAG)\"))) | first | .databaseId // empty")
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::fuzzley.github.io started no Pages run for fuzzley run $RUN_TAG."
            exit 1
          fi

          echo "Waiting for https://github.com/fuzzley/fuzzley.github.io/actions/runs/$run_id"
          gh run watch "$run_id" --repo fuzzley/fuzzley.github.io --exit-status --interval 10
