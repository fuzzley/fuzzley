<!doctype html>
<html lang="en">
  <head>
    <title>fSolitaire</title>
    <meta charset="UTF-8" />
    <!--
      No `user-scalable=no`: the board is a canvas, but the header, the game
      rail and the settings drawer are real text, and blocking pinch-zoom on
      them fails WCAG 1.4.4 for anyone who needs to enlarge it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="cleartype" content="on" />
    <!--
      Tints the browser's own chrome on mobile to match the header, so the
      address bar does not sit as a light band above a dark application. The
      panel colour rather than the felt: the top of the page is the header, and
      unlike the felt it is the same colour whichever table theme is chosen.
    -->
    <meta name="theme-color" content="#0f172a" />
    <!--
      The document reset and the `app-root { height: 100% }` rule the whole
      absolute-positioned layout depends on live in src/ui/app/styles/,
      alongside the design tokens, rather than being invisible here.
    -->
    <script type="module" crossorigin src="./assets/index-CKU1Uyxj.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-DcsX20_Y.js">
    <link rel="stylesheet" crossorigin href="./assets/index-D5KSRqS_.css">
  </head>
